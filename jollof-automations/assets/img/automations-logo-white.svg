<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="650" height="200" fill="none">
  <!-- Circuit & Gear Emblem on the left -->
  <g transform="translate(15, 20)">
    <!-- Circuit corner nodes and traces -->
    <circle cx="20" cy="20" r="10" stroke="#f7f6f0" stroke-width="4" fill="none" />
    <circle cx="20" cy="20" r="3" fill="#c29c4b" />
    <line x1="30" y1="20" x2="60" y2="20" stroke="#f7f6f0" stroke-width="4" stroke-dasharray="6,4" />

    <circle cx="140" cy="20" r="10" stroke="#f7f6f0" stroke-width="4" fill="none" />
    <circle cx="140" cy="20" r="3" fill="#c29c4b" />
    <line x1="140" y1="30" x2="140" y2="60" stroke="#f7f6f0" stroke-width="4" stroke-dasharray="6,4" />

    <circle cx="20" cy="140" r="10" stroke="#f7f6f0" stroke-width="4" fill="none" />
    <circle cx="20" cy="140" r="3" fill="#c29c4b" />
    <line x1="20" y1="130" x2="20" y2="100" stroke="#f7f6f0" stroke-width="4" stroke-dasharray="6,4" />

    <circle cx="140" cy="140" r="10" stroke="#f7f6f0" stroke-width="4" fill="none" />
    <circle cx="140" cy="140" r="3" fill="#c29c4b" />
    <line x1="130" y1="140" x2="100" y2="140" stroke="#f7f6f0" stroke-width="4" stroke-dasharray="6,4" />

    <path d="M 20 50 L 20 80 L 35 80" stroke="#f7f6f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="35" cy="80" r="2.5" fill="#c29c4b" />

    <path d="M 140 110 L 140 80 L 125 80" stroke="#f7f6f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="125" cy="80" r="2.5" fill="#c29c4b" />

    <path d="M 50 140 L 80 140 L 80 125" stroke="#f7f6f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="80" cy="125" r="2.5" fill="#c29c4b" />

    <path d="M 110 20 L 80 20 L 80 35" stroke="#f7f6f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="80" cy="35" r="2.5" fill="#c29c4b" />

    <!-- Center Gear / Cogwheel -->
    <g transform="translate(80, 80)">
      <path d="
        M -12 -38 L 12 -38 L 10 -30 L 22 -26 L 31 -33 L 42 -18 L 33 -12 L 36 0 L 44 6 L 36 21 L 26 18 L 18 27 L 22 36 L 6 43 L 0 35 L -12 36 L -16 44 L -32 35 L -26 25 L -35 17 L -43 21 L -45 5 L -36 0 L -35 -13 L -44 -20 L -33 -32 L -23 -24 L -13 -31 Z
      " fill="none" stroke="#f7f6f0" stroke-width="5" stroke-linejoin="round" />

      <circle cx="0" cy="0" r="22" stroke="#f7f6f0" stroke-width="4" fill="none" />
      <polygon points="-6,-10 -6,10 10,0" fill="#c29c4b" />
    </g>
  </g>

  <!-- Brand Wordmark -->
  <text x="185" y="125" font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" font-size="124" font-weight="700" fill="#ffffff" letter-spacing="-2px">
    <tspan fill="#ffffff">J</tspan><tspan dx="-6">ollof</tspan>
  </text>

  <text x="215" y="165" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#c29c4b" letter-spacing="14px">AUTOMATIONS</text>
</svg>
